<script>
const STORAGE_KEY='aresfit_rep_course_v6_state';
const BACKUP_KEY='aresfit_rep_course_v6_backup';
const LEGACY_KEYS=['aresfit_rep_course_v5_state','aresfit_rep_course_v3_state'];
const VERSION='6.0';

const modules=[{"id":"ownership","title":"Owning the lead from first call to close","summary":"Understand the full sales responsibility: cold outreach, discovery, quote support, follow-up and closing.","steps":[{"type":"brief","title":"You own the commercial relationship","html":"\n<h2>Your responsibility runs from the first cold call to the final outcome</h2>\n<p class=\"short-copy\">You do not simply find interest and pass the lead away. You remain responsible for moving the opportunity forward until it is won, lost, paused or formally reassigned.</p>\n<div class=\"two-col\">\n  <div class=\"mini-card\"><h3>You handle</h3><p>Gatekeeper routing, decision-maker conversations, discovery, qualification, product discussions, follow-ups, quote presentation, objections and closing.</p></div>\n  <div class=\"mini-card\"><h3>Michael supports</h3><p>Quote preparation, pricing or discount approval, supplier checks, delivery or installation confirmation and anything you need help resolving.</p></div>\n</div>\n<div class=\"callout good\"><strong>The lead stays yours</strong><p>Asking Michael for quote support or advice does not end your responsibility to the buyer.</p></div>"},{"type":"choice","title":"When the buyer asks for a quote","scenario":"A gym owner confirms a real requirement and asks for suitable options and a quote by Friday.","prompt":"What should the rep do next?","options":[{"text":"Send the basic details to Michael and wait for Michael to take over the customer.","correct":false,"feedback":"Michael supports the quote process, but the rep still owns the customer relationship and next actions."},{"text":"Finish collecting the commercial details, send Michael a complete quote brief, agree the next contact with the buyer and continue managing the opportunity.","correct":true,"feedback":"Correct. The quote process is support within your sale, not a handover of the lead."},{"text":"Send a catalogue first and only involve Michael if the customer chooses exact models alone.","correct":false,"feedback":"The rep should help define the requirement and suitable options rather than transferring all selection work to the customer."}]},{"type":"brief","title":"Use support without losing control","html":"\n<h2>Bring Michael in when a decision or confirmation is needed</h2>\n<p class=\"short-copy\">Contact Michael during the quote process, whenever you need help, or when the customer requests something you cannot confirm yourself.</p>\n<ul class=\"compact-list\">\n<li><strong>Good support request:</strong> full requirement, quantities, budget, timing, access, decision process, competitor context and the exact answer or approval needed.</li>\n<li><strong>Your next job:</strong> keep the customer updated, return with the answer, present the options and continue the follow-up.</li>\n<li><strong>Never assume:</strong> final pricing, stock, discounts, lead times, installation dates, exact warranty or finance approval.</li>\n</ul>"},{"type":"choice","title":"When you need product help","scenario":"A buyer wants commercial treadmills at £6,000–£8,000 per unit, but you are not certain which models best match their usage and feature requirements.","prompt":"What is the strongest action?","options":[{"text":"Ask Michael to take the lead because product selection has become technical.","correct":false,"feedback":"You should use Michael for support while retaining ownership of the buyer and the discovery process."},{"text":"Collect the remaining usage, feature and site requirements, ask Michael for model or supplier support, then return to the buyer with suitable options.","correct":true,"feedback":"Correct. You gather the facts, use support intelligently and continue the sale."},{"text":"Choose the highest-priced treadmill in the range because it fits the stated budget.","correct":false,"feedback":"Budget alone does not determine product suitability."}]},{"type":"tap","title":"The complete rep responsibility","cards":[{"front":"Prospect","back":"Cold call the correct organisations and work only your assigned leads."},{"front":"Reach","back":"Get past the gatekeeper and speak with the equipment decision-maker."},{"front":"Discover","back":"Understand their current setup, supplier arrangement, need and buying process."},{"front":"Develop","back":"Help narrow the right equipment, quantities and commercial route."},{"front":"Quote","back":"Bring Michael in for quote support and required approvals while retaining the lead."},{"front":"Close","back":"Present, follow up, handle objections and secure the final decision."}]}]},{"id":"gatekeepers","title":"Getting past gatekeepers","summary":"Reach the equipment decision-maker quickly or secure the most specific callback route possible.","steps":[{"type":"brief","title":"The gatekeeper is a routing step","html":"\n<h2>Do not spend a minute pitching the receptionist</h2>\n<p class=\"short-copy\">Your objective is to reach the person responsible for equipment purchasing as quickly as possible. Keep the reason simple and move directly to the decision-maker.</p>\n<div class=\"callout good\"><strong>When the name is unknown</strong><p>“Hi, who looks after equipment purchasing there?”</p></div>\n<div class=\"callout good\"><strong>When the name is known</strong><p>“Hi, is [Name] available?”</p></div>\n<p>You do not need a long company introduction, full product explanation or permission to pitch the gatekeeper.</p>"},{"type":"choice","title":"Your first line to reception","scenario":"You call an independent gym. You do not know the name of the equipment decision-maker.","prompt":"Which opening best matches the objective?","options":[{"text":"Hello, my name is Alex from AresFit, a commercial equipment supplier. I would like to introduce our business to the manager, please.","correct":false,"feedback":"This is formal, slow and encourages the gatekeeper to block or redirect the pitch."},{"text":"Hi, who looks after equipment purchasing there?","correct":true,"feedback":"Correct. It is direct, easy to answer and moves immediately towards the right person."},{"text":"Hi, could I tell you a little about our gym-equipment range before I speak to the manager?","correct":false,"feedback":"The gatekeeper is not the audience for the product conversation."}]},{"type":"brief","title":"When the decision-maker is unavailable","html":"\n<h2>Do not accept a vague callback</h2>\n<p class=\"short-copy\">Keep narrowing until you have the clearest realistic time to reach them.</p>\n<ul class=\"compact-list\">\n<li>“When are they next available?”</li>\n<li>“Roughly what time tomorrow?”</li>\n<li>“What time are they normally in the gym?”</li>\n<li>“When do their lessons finish?”</li>\n<li>“Would I be better calling before the first class or after the last one?”</li>\n</ul>\n<div class=\"callout warn\"><strong>Five useful minutes is enough</strong><p>You are not trying to book a formal meeting through reception. You are trying to create a realistic route to a short conversation with the decision-maker.</p></div>"},{"type":"choice","title":"Turning ‘tomorrow’ into a callback","scenario":"Reception says the owner is in and out tomorrow and teaches classes most of the day.","prompt":"What should you ask next?","options":[{"text":"No problem. I will try again tomorrow at some point.","correct":false,"feedback":"This creates a vague retry with no useful timing information."},{"text":"Do you know roughly when the classes finish, or whether I would be more likely to catch them just before the first class or after the last one? I only need five minutes.","correct":true,"feedback":"Correct. You use their schedule to pin down the best route to the decision-maker."},{"text":"Could you ask the owner to call me whenever they are free?","correct":false,"feedback":"An unprompted return call is much less controllable than a specific rep-owned callback."}]},{"type":"tap","title":"Useful gatekeeper outcomes","cards":[{"front":"Decision-maker name","back":"Who actually controls or influences equipment purchasing."},{"front":"Role","back":"Owner, manager, operations lead, procurement contact or another relevant title."},{"front":"Availability","back":"The most specific day and time you can establish."},{"front":"Direct route","back":"Direct number, extension or named email where it is genuinely useful."},{"front":"Callback ownership","back":"You call them at the agreed time rather than waiting indefinitely for them to call you."}]}]},{"id":"d
