<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AresFit Sales Rep Course</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#10233f;display:grid;place-items:center;min-height:100vh}.box{max-width:620px;background:#fff;border:1px solid #cbd5e1;padding:32px;box-shadow:0 12px 35px rgba(15,35,63,.12)}h1{margin-top:0}.bar{height:8px;background:#dbe7f4;margin-top:20px;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:40%;background:#1d5fa7;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(280%)}}.err{color:#a12b2b;white-space:pre-wrap}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="box"><h1>AresFit Sales Rep Course</h1><p id="status">Loading the course…</p><div class="bar" id="bar"></div><p class="err" id="err"></p></div><script>(async()=>{try{const zipUrl='https://raw.githubusercontent.com/michaelini0309/Aresfit---Sales-rep-course-/main/AresFit_Sales_Course_GitHub_Ready.zip';const r=await fetch(zipUrl,{cache:'no-store'});if(!r.ok)throw new Error('Could not download the course package ('+r.status+').');const z=await JSZip.loadAsync(await r.arrayBuffer());const names=Object.keys(z.files);const name=names.find(n=>/(^|\/)index\.html$/i.test(n));if(!name)throw new Error('The course package does not contain index.html.');const page=await z.file(name).async('string');document.open();document.write(page);document.close()}catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent='The course could not be loaded.';document.getElementById('err').textContent=e.message}})();</script></body></html>
