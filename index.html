<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresFit Sales Rep Course v7.5</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#10233f}body{display:grid;place-items:center}.box{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #cbd5e1;padding:32px;box-shadow:0 12px 35px rgba(15,35,63,.12)}h1{margin:0 0 8px}.version{font-size:12px;color:#64748b}.bar{height:8px;background:#dbe7f4;margin-top:20px;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:40%;background:#315c8c;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(280%)}}#err{color:#a12b2b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><h1>AresFit Sales Rep Course</h1><div class="version">Loading full course v7.5</div><p id="status">Loading the training platform…</p><div class="bar" id="bar"></div><p id="err"></p></div>
<script>
(async()=>{
  try{
    const stamp='v75-rep-independence-real-scenarios';
    const files=Array.from({length:12},(_,i)=>`course-v74/part-${String(i+1).padStart(2,'0')}.html?v=${stamp}`);
    const parts=[];
    for(const file of files){
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(`Missing course file: ${file} (${response.status})`);
      const text=await response.text();
      if(!text) throw new Error(`Empty course file: ${file}`);
      parts.push(text);
    }
    let html=parts.join('');
    const checks=['<!doctype html>','AresFit Sales Rep Course v7.4','How AresFit works as a supplier',"const VERSION='7.4'","const ADMIN_PIN='789654'",'repSignInBtn','AresFit Rep Training v7.4','</html>'];
    const missing=checks.filter(marker=>!html.toLowerCase().includes(marker.toLowerCase()));
    if(missing.length) throw new Error(`The published v7.4 course failed its integrity check: ${missing.join(', ')}`);

    html=html.replace("try{adminUnlocked=localStorage.getItem(ADMIN_KEY)==='1';}catch(e){}","try{localStorage.removeItem(ADMIN_KEY)}catch(e){}");
    html=html.replace("try{localStorage.setItem(ADMIN_KEY,adminUnlocked?'1':'0')}catch(e){}","try{localStorage.removeItem(ADMIN_KEY)}catch(e){}");

    const moduleStartMarker='const modules=[';
    const moduleEndMarker='];\nconst assessmentQuestions=';
    const moduleStart=html.indexOf(moduleStartMarker);
    const moduleEnd=html.indexOf(moduleEndMarker,moduleStart);
    if(moduleStart<0||moduleEnd<0) throw new Error('Could not locate course modules.');
    const bodyStart=moduleStart+moduleStartMarker.length;
    const body=html.slice(bodyStart,moduleEnd);
    const items=[];
    let i=0;
    while(i<body.length){
      while(i<body.length&&/[\s,]/.test(body[i])) i++;
      if(i>=body.length) break;
      if(body[i]!=='{') throw new Error('Course module structure is invalid.');
      const start=i;
      let depth=0,inString=false,escaped=false;
      for(;i<body.length;i++){
        const ch=body[i];
        if(inString){
          if(escaped) escaped=false;
          else if(ch==='\\') escaped=true;
          else if(ch==='"') inString=false;
        }else{
          if(ch==='"') inString=true;
          else if(ch==='{'||ch==='[') depth++;
          else if(ch==='}'||ch===']'){
            depth--;
            if(depth===0){i++;items.push(body.slice(start,i));break;}
          }
        }
      }
    }
    const ownershipIndex=items.findIndex(item=>item.includes('"id":"ownership"'));
    const businessIndex=items.findIndex(item=>item.includes('"id":"aresfit_business"'));
    if(ownershipIndex<0||businessIndex<0) throw new Error('Required opening modules are missing.');
    if(businessIndex!==0){
      const business=items.splice(businessIndex,1)[0];
      items.unshift(business);
    }
    const ownershipNow=items.findIndex(item=>item.includes('"id":"ownership"'));
    if(ownershipNow!==1){
      const ownership=items.splice(ownershipNow,1)[0];
      items.splice(1,0,ownership);
    }

    const modules=items.map((item,index)=>{
      try{return JSON.parse(item)}catch(error){throw new Error(`Could not parse course module ${index+1}: ${error.message}`)}
    });
    const moduleById=id=>{
      const module=modules.find(entry=>entry.id===id);
      if(!module) throw new Error(`Required course module missing: ${id}`);
      return module;
    };
    const stepByTitle=(module,title)=>module.steps.find(step=>step.title===title);
    const flattenTap=(module,title,newTitle)=>{
      const idx=module.steps.findIndex(step=>step.title===title&&step.type==='tap');
      if(idx<0) return;
      const cards=module.steps[idx].cards||[];
      module.steps[idx]={type:'brief',title:newTitle||title,html:`<h2>${newTitle||title}</h2><ul class="compact-list">${cards.map(card=>`<li><strong>${card.front}:</strong> ${card.back}</li>`).join('')}</ul>`};
    };

    const business=moduleById('aresfit_business');
    const flow=stepByTitle(business,'The commercial order flow');
    if(flow){
      flow.html=`<h2>The rep should be able to move a normal sale forward without asking Michael every two minutes</h2><ol class="compact-list"><li><strong>Discover:</strong> understand the buyer, intended use, quantity, budget, timing, decision process and site.</li><li><strong>Specify:</strong> use the approved catalogue and product knowledge to narrow the suitable equipment yourself.</li><li><strong>Prepare:</strong> once the customer requirement is clear, build the product schedule or quote using the approved process you have been trained on.</li><li><strong>Confirm restricted facts:</strong> stock, exact lead time, delivery or installation price, unauthorised discount, exact warranty wording and finance approval still require the correct confirmation.</li><li><strong>Return to the buyer:</strong> present the option, answer normal product questions, agree the next action and continue the sale.</li></ol><div class="callout good"><strong>Escalate for authority or genuinely unknown facts - not because you have not learned the products.</strong><p>The goal is a capable rep who can run the opportunity. Michael is the first internal point of contact when something genuinely needs checking; Sandde should receive a complete, clean case rather than unfinished rep questions.</p></div>`;
    }
    flattenTap(business,'AresFit operating rules','AresFit operating rules - quick summary');

    const ownership=moduleById('ownership');
    ownership.summary='Own the sale, solve normal rep-level questions yourself and escalate only genuine confirmations or authority decisions.';
    const support=stepByTitle(ownership,'Use support without losing control');
    if(support){
      support.html=`<h2>Michael is support and quality control, not the rep's substitute brain</h2><p class="short-copy">You are expected to learn the equipment, qualify properly and answer normal sales questions yourself. Do not repeatedly tell customers you need to ask Michael whenever they ask something ordinary.</p><div class="two-col"><div class="mini-card"><h3>Handle yourself</h3><p>Discovery, product-family knowledge, normal comparisons, quantities, customer priorities, initial product selection, quote preparation when trained, follow-up and objection diagnosis.</p></div><div class="mini-card"><h3>Confirm internally</h3><p>Stock, exact lead time, delivery or installation pricing, unauthorised discount, exact warranty wording, finance approval/terms, unusual technical questions or anything outside your authority.</p></div></div><div class="callout good"><strong>First internal contact: Michael</strong><p>Bring Michael a clear question and all the facts. Michael resolves the rep-level rubbish and makes sure anything that reaches Sandde is complete enough for Sandde to act without having to interrogate the rep.</p></div><div class="callout warn"><strong>Customer-facing wording</strong><p>If a fact genuinely needs confirmation, say you will confirm it and come back to them. Do not make the customer feel that every answer requires permission from Michael.</p></div>`;
    }
    const productHelp=stepByTitle(ownership,'When you need product help');
    if(productHelp){
      Object.assign(productHelp,{type:'choice',title:'When should product selection come back to Michael?',scenario:'A buyer wants six selectorised strength stations. You have confirmed the movements, users, footprint, loading style, budget and commercial environment, and the approved product guide gives you clear Nautilus options.',prompt:'What is the strongest next action?',options:[{text:'Send the whole requirement to Michael and ask him to choose every product because product selection is not a rep responsibility.',correct:false,feedback:'That creates a dependent rep. Normal product selection should increasingly be handled by the rep.'},{text:'Use the approved product information to build a sensible shortlist or quote yourself, then ask Michael only for any supplier, technical, delivery or approval fact that is still genuinely unconfirmed.',correct:true,feedback:'Correct. The rep owns the selection and uses internal support only where it adds authority or information the rep cannot verify alone.'},{text:'Choose whichever model has the highest website price because the buyer has already provided a budget.',correct:false,feedback:'Budget does not replace product-fit judgement.'}]});
    }
    flattenTap(ownership,'The complete rep responsibility','The complete rep responsibility - at a glance');

    const gatekeepers=moduleById('gatekeepers');
    gatekeepers.steps.push(
      {type:'choice',title:'Gatekeeper says: We already have equipment',scenario:'Reception says, "We already have all our gym equipment, thanks." You have not spoken with the equipment decision-maker.',prompt:'What is the best response?',options:[{text:'Treat that as a rejection and mark the business uninterested.',correct:false,feedback:'A gym having equipment is expected and says nothing about future replacement or purchasing.'},{text:'Acknowledge it and clarify that you are asking who handles future replacements, additions or refurbishments, then request the correct person or best time to reach them.',correct:true,feedback:'Correct. Reframe the reason for the call without arguing with reception.'},{text:'Tell reception their equipment is probably old and needs replacing.',correct:false,feedback:'That is an unsupported claim and creates resistance.'},{text:'Ask reception for the current equipment value before asking for the decision-maker.',correct:false,feedback:'That is not a useful gatekeeper question.'}]},
      {type:'choice',title:'Gatekeeper says: We already have a supplier',scenario:'Reception says, "We already use a supplier, so the manager will not need this." There has been no direct decision-maker conversation.',prompt:'What should the rep do?',options:[{text:'Explain that using another supplier is normal and ask who handles equipment purchasing so AresFit can be considered for future replacements, alternatives or overflow where relevant.',correct:true,feedback:'Correct. Existing supplier use is discovery information, not automatic disqualification.'},{text:'Promise AresFit will beat the existing supplier on price if they transfer the call.',correct:false,feedback:'There is no basis or authority for that promise.'},{text:'Ask reception to cancel the current supplier first.',correct:false,feedback:'This is unrealistic and confrontational.'},{text:'Mark the lead dead because supplier loyalty can never change.',correct:false,feedback:'A second supplier, replacement gap or future review may still exist.'}]},
      {type:'choice',title:'Gatekeeper says: They are not interested',scenario:'A receptionist says, "The owner is not interested." They do not say they spoke to the owner about AresFit today, and there is no do-not-contact request.',prompt:'How should this be treated?',options:[{text:'Ask one calm routing question to establish whether that is the owner\'s actual decision or the gatekeeper\'s assumption, and if appropriate ask when the equipment decision-maker is available.',correct:true,feedback:'Correct. A gatekeeper opinion is not automatically a decision-maker rejection. Do not push through a clear do-not-contact request.'},{text:'Record a decision-maker rejection immediately.',correct:false,feedback:'You have not established that the decision-maker made the decision.'},{text:'Argue with reception until they transfer the call.',correct:false,feedback:'The aim is professional routing, not a fight with the gatekeeper.'},{text:'Call back every hour until a different staff member answers.',correct:false,feedback:'That is excessive and ignores professional contact control.'}]},
      {type:'choice',title:'Gatekeeper says: Just send an email',scenario:'Reception says, "Just email something over." You still do not know the equipment decision-maker or whether anything is planned.',prompt:'What is the strongest response before ending the call?',options:[{text:'Send the entire catalogue to the general inbox and wait indefinitely.',correct:false,feedback:'That creates an unfocused email with no owner or next action.'},{text:'Give a full product pitch to reception so they can decide what should be emailed.',correct:false,feedback:'Reception is still a routing step.'},{text:'Confirm the decision-maker\'s name and correct email, ask one useful planning question if appropriate, and establish when a sensible follow-up would be.',correct:true,feedback:'Correct. The email becomes attached to a person, purpose and next action.'},{text:'Refuse to email unless they transfer the call immediately.',correct:false,feedback:'Email can be useful if it is qualified and followed up properly.'}]}
    );

    const solution=moduleById('solution');
    solution.steps.splice(1,0,
      {type:'brief',title:'Questions that reveal product fit without forcing the customer to name a model',html:`<h2>Ask about the problem and environment - the product answer should fall out of the conversation</h2><p class="short-copy">A good rep does not need the customer to know the catalogue. Ask questions that expose the use case, then translate the answers into equipment requirements.</p><ul class="compact-list"><li><strong>Who will use it?</strong> Member type, ability, rehabilitation/accessibility needs and expected daily traffic.</li><li><strong>What are you trying to improve?</strong> Replacement, extra capacity, a new training style, member complaints, reliability or a new site.</li><li><strong>What do you have now?</strong> Current brand/model, what works, what members like and what they dislike.</li><li><strong>How will it be trained on?</strong> Movement, loading style, class format, performance needs, console/data requirements or simplicity.</li><li><strong>What physical limits matter?</strong> Floor area, ceiling, doorway, rack height, power, anchoring and route into the room.</li><li><strong>What commercial limits matter?</strong> Quantity, budget, deadline, expected lifetime, service priorities and whether matching the existing line matters.</li></ul><div class="callout good"><strong>Think: customer answer -> requirement -> product family -> exact model.</strong><p>The better your equipment knowledge becomes, the less often basic product selection needs to come back to Michael.</p></div>`},
      {type:'choice',title:'Indirect discovery in practice',scenario:'A 24/7 independent gym says its current strength area gets queues at peak times. Members range from beginners to experienced lifters. The owner dislikes complicated adjustments, wants the new kit to feel consistent, and has limited floor space.',prompt:'Which question sequence is most useful before naming products?',options:[{text:'Ask for the maximum budget first, then recommend the most expensive Nautilus line that fits it.',correct:false,feedback:'The customer has already given several product clues; budget alone will not choose the right equipment.'},{text:'Ask which movements cause the queues, what existing machines they want to keep or match, how simple the adjustments need to be, the available footprint and expected traffic, then use those answers to narrow the appropriate selectorised range.',correct:true,feedback:'Correct. The questions convert operational problems into product requirements.'},{text:'Send every strength range and ask the owner to decide which pictures look best.',correct:false,feedback:'That pushes the product-selection work back onto the customer.'},{text:'Ask Michael to call the owner because the requirement is too detailed for a rep.',correct:false,feedback:'This is exactly the type of requirement a trained rep should be able to develop.'}]}
    );

    const cardio=moduleById('equipment_cardio');
    cardio.steps.push({type:'brief',title:'Know which Core cardio routes are genuinely commercial',html:`<h2>Commercial rating comes before the detailed warranty numbers</h2><p class="short-copy">For the UK/international commercial column in the current Core matrix, learn the broad suitability first. Exact component warranty wording can still be checked when a customer asks.</p><div class="two-col"><div class="mini-card"><h3>Commercial routes</h3><p>Star Trac 10TRX; Star Trac 6 and 8 Series treadmills; 6 and 8 Series ellipticals and upright/recumbent bikes; Star Trac Virtual Bike; Star Trac S-TRC and S-Series cross trainer/upright/recumbent; StairMaster 10G, 8GX, FreeClimber, Jacobs Ladder JL/JLX and Stairway GTL. Group cycle bikes also carry an international commercial route in the matrix.</p></div><div class="mini-card"><h3>Do not present as full commercial</h3><p>Star Trac 4 Series treadmill; Star Trac 4 Series cross trainer/upright/recumbent/4G; Star Trac S-TRX; StairMaster Jacobs Ladder 2. These are shown as not intended for commercial use under the international commercial column.</p></div></div><div class="callout warn"><strong>Still verify the exact model and current matrix before promising warranty terms.</strong><p>The practical lesson is to avoid putting a non-commercial/light-commercial route into a normal dues-paying commercial gym simply because it is cheaper.</p></div>`});

    const strength=moduleById('equipment_strength');
    strength.steps.push({type:'brief',title:'Nautilus commercial versus light-commercial strength',html:`<h2>Know the line before you quote the line</h2><p class="short-copy">The current Core strength matrix places Nautilus Inspiration, One, EVO, HumanSport, Leverage, Impact, Plate Loaded, XPLOAD, XPLOAD Zone, Multi-Stations, Benches/Racks and Pilates within the commercial strength warranty family. <strong>Instinct is specifically marked light commercial.</strong></p><div class="callout good"><strong>For a normal commercial gym:</strong><p>Start with a genuinely commercial range that fits the movement, traffic and space. Do not use Instinct as if it were automatically the same commercial duty level as the full-commercial ranges.</p></div><p>Exact product configuration and warranty detail still require the current approved source when the customer asks for a specific commitment.</p>`});

    const quotes=moduleById('quotes');
    quotes.summary='Turn a confirmed customer requirement into a quoteable product schedule yourself, then obtain only the confirmations or approvals you genuinely need.';
    const quoteFlow=stepByTitle(quotes,'What happens when a quote is needed');
    if(quoteFlow){
      quoteFlow.html=`<h2>A trained rep should increasingly be able to prepare the quote without Michael building the sale for them</h2><ol class="compact-list"><li><strong>Finish discovery:</strong> customer, products, quantities, use case, features, budget, timing, access and decision process.</li><li><strong>Select the equipment:</strong> use approved product information and your training to choose the sensible models or shortlist.</li><li><strong>Build the quote/product schedule:</strong> use the approved AresFit quote process you have been trained and authorised to use.</li><li><strong>Identify only the genuine unknowns:</strong> stock, exact lead time, delivery/installation cost, non-standard discount, exact warranty wording, finance or a technical supplier point.</li><li><strong>Bring Michael a clean request:</strong> customer requirement plus the exact confirmations required. Michael should not have to rediscover the whole sale.</li><li><strong>Return and close:</strong> present the quote, handle normal questions, agree the review and keep ownership.</li></ol>`;
    }
    const quoteRequest=stepByTitle(quotes,'A complete quote-support request');
    if(quoteRequest){
      Object.assign(quoteRequest,{scenario:'Tom owns Apex Strength. He wants five commercial treadmills for a September refit, expects GBP 6,000-8,000 per unit, values simple reliable consoles, has first-floor goods-lift access and wants the quote by Friday. You have already narrowed two suitable approved models.',prompt:'What should happen next?',options:[{text:'Ask Michael to restart discovery and choose the products from scratch.',correct:false,feedback:'The rep has already done the work needed to narrow the products.'},{text:'Prepare the product schedule/quote using the approved process, then send Michael the complete case with only the remaining confirmations - for example current stock/lead time, delivery/install price and any required approval - before making those commitments to Tom.',correct:true,feedback:'Correct. The rep does the normal quote work; Michael supplies missing authority or confirmation.'},{text:'Promise delivery is included because the goods lift sounds straightforward.',correct:false,feedback:'Delivery scope and price still require confirmation.'},{text:'Send the website links and ask Tom to build his own quote.',correct:false,feedback:'The rep should reduce work for the buyer, not transfer the sales task to them.'}]});
    }
    flattenTap(quotes,'Quote rules','Quote rules - quick summary');

    const delivery=moduleById('access_delivery');
    flattenTap(delivery,'The access checklist','Access checklist - keep this visible while qualifying');
    delivery.steps=delivery.steps.filter(step=>step.title!=='Build a complete access brief');
    const deliveryInsert=Math.max(1,delivery.steps.findIndex(step=>step.title==='Access mistakes that create cost'));
    delivery.steps.splice(deliveryInsert,0,
      {type:'choice',title:'Delivery scenario - straightforward but still needs clarifying',scenario:'The customer says: "We are a ground-floor industrial unit. A van can pull up right outside the roller shutter and the equipment is going into the main gym area just inside. We want delivery and installation."',prompt:'What should the rep do with that information?',options:[{text:'Treat delivery and installation as confirmed because the customer called the access easy.',correct:false,feedback:'The route sounds favourable, but service scope and key physical details still need recording.'},{text:'Ask the customer to fill in the access form themselves and send it back before discussing anything else.',correct:false,feedback:'The rep should turn the customer conversation into the delivery brief, not outsource the rep job to the buyer.'},{text:'Record ground floor, direct unloading and roller-shutter route; confirm full address/contact, shutter dimensions/threshold, vehicle or site restrictions, exact final position, assembly/installation expectation, pallet removal and any power/anchoring needs, then obtain the delivery/install price.',correct:true,feedback:'Correct. You use the customer\'s natural description, then fill the few gaps needed for a real quote.'},{text:'Ignore access until after the equipment invoice is paid.',correct:false,feedback:'Access can materially change delivery feasibility and cost.'}]},
      {type:'choice',title:'Delivery scenario - customer gives a vague "it will be fine" description',scenario:'The customer says: "We are upstairs but there is a lift. We have had machines delivered before, parking is not really an issue, and you just come through the front then reception. It should be fine."',prompt:'Which response shows the best delivery judgement?',options:[{text:'Accept it as full installation access because previous machines have been delivered.',correct:false,feedback:'Previous deliveries do not prove the new equipment or service will fit the same route.'},{text:'Confirm the unloading point and restrictions, front-door and internal route widths/corners, lift door and internal dimensions, lift load limit, final floor/room/position, any stairs or level changes, delivery window and installation scope; request photos or measurements where the description stays vague.',correct:true,feedback:'Correct. The rep converts casual customer language into a usable logistics brief.'},{text:'Ask Michael to call the customer and collect all delivery information.',correct:false,feedback:'Access qualification is a rep responsibility.'},{text:'Quote kerbside only and let the installers solve the route when they arrive.',correct:false,feedback:'That creates cost and expectation risk.'}]}
    );

    const notes=moduleById('notes');
    notes.summary='Use the app outcomes correctly, record the commercial facts that matter and stop over-testing obvious note-writing.';
    notes.steps=notes.steps.filter(step=>!['Choosing the actionable note','Build an actionable opportunity note'].includes(step.title));
    notes.steps.splice(1,0,{type:'brief',title:'Know what the main app outcomes actually mean',html:`<h2>The outcome should tell the next person what actually happened</h2><ul class="compact-list"><li><strong>Contact / Contacted:</strong> a genuine conversation or successful contact. Add the useful commercial facts and next action.</li><li><strong>No Answer / NA:</strong> the call rang with no answer.</li><li><strong>Voicemail / VM:</strong> voicemail was reached. Note whether you actually left a message; do not pretend a message was left if it was not.</li><li><strong>Awaiting Callback:</strong> the prospect or staff member is expected to call back but there is no specific agreed time.</li><li><strong>Callback:</strong> there is a real date, time or defined call window for the next contact. Record what the timing is based on.</li><li><strong>Dead Air / ineligible-lead convention:</strong> use the team\'s current outcome convention only after checking the Lead Research/Map view and confirming the business is not a usable gym/facility or there is no clear gym site. Do not kill a valid lead because the data looks messy.</li></ul><div class="callout warn"><strong>Use the Lead Research/Map check for eligibility.</strong><p>The other research buttons are not part of the normal working process unless Michael specifically tells you otherwise.</p></div>`});
    notes.steps.push(
      {type:'choice',title:'Awaiting callback or callback?',scenario:'Reception takes your details and says the owner should ring you back, but gives no time and the owner has not agreed a slot.',prompt:'Which outcome best matches what actually happened?',options:[{text:'Callback at 15:00 today.',correct:false,feedback:'No specific time was agreed.'},{text:'Contacted - sale qualified.',correct:false,feedback:'You have not spoken with the decision-maker or qualified a sale.'},{text:'Awaiting Callback, with the factual note that reception took the details and no time was agreed.',correct:true,feedback:'Correct. Use Callback only when there is a real date/time/window.'},{text:'No Answer.',correct:false,feedback:'Someone answered and took details.'}]},
      {type:'choice',title:'Voicemail outcome',scenario:'The call reaches voicemail. You hang up without leaving a message because you plan to retry at a better time.',prompt:'What should the record show?',options:[{text:'Voicemail/VM and a truthful note that no message was left, or allow the approved app auto-note if that is how the current version works.',correct:true,feedback:'Correct. The record should not imply the customer received a message.'},{text:'Contacted because the voicemail system answered.',correct:false,feedback:'Voicemail is not a decision-maker conversation.'},{text:'Awaiting Callback because the customer now has your number.',correct:false,feedback:'They were not asked to call and no callback was agreed.'},{text:'DNC because repeated voicemail means they are not interested.',correct:false,feedback:'No answer/voicemail and do-not-contact are different outcomes.'}]}
    );
    flattenTap(notes,'Before saving the note','Before saving the note - quick check');

    const serializedModules=modules.map(module=>JSON.stringify(module)).join(',');
    html=html.slice(0,bodyStart)+serializedModules+html.slice(moduleEnd);

    const assessmentStartMarker='const assessmentQuestions=[';
    const assessmentEndMarker='];\n\nfunction freshState';
    const assessmentStart=html.indexOf(assessmentStartMarker);
    const assessmentEnd=html.indexOf(assessmentEndMarker,assessmentStart);
    if(assessmentStart<0||assessmentEnd<0) throw new Error('Could not locate assessment questions.');
    const assessmentBodyStart=assessmentStart+assessmentStartMarker.length;
    const assessmentQuestions=[
      {category:'Product discovery',weight:5,critical:true,scenario:'A buyer says members queue for lower-body machines at peak time, beginners find the current kit confusing and floor space is tight. They ask what AresFit would recommend.',prompt:'What should the rep do before naming models?',options:['Ask only for the maximum budget and use the premium range.','Send every Nautilus range and ask the buyer to pick.','Clarify the movements causing queues, user mix, adjustment simplicity, existing line, footprint and traffic; then narrow suitable commercial options from the answers.','Ask Michael to choose the products because recommendation is not a rep task.'],answer:2,explain:'The product should be derived from the use case. A trained rep should do normal product discovery and narrowing.'},
      {category:'Gatekeeper - equipment',weight:3,critical:false,scenario:'Reception says, "We already have equipment." You have not spoken with the buyer.',prompt:'What is the strongest response?',options:['Ask how much the existing gym floor cost.','Acknowledge it and clarify you are asking who handles future replacements, additions or refurbishments, then request the correct person or timing.','Mark the gym uninterested.','Promise a free comparison if they transfer you.'],answer:1,explain:'A gym having equipment is expected and does not answer whether future purchasing exists.'},
      {category:'Gatekeeper - supplier',weight:5,critical:true,scenario:'Reception says, "We already have a supplier and the owner will not need another." There is no direct DM rejection.',prompt:'What is the best next move?',options:['Tell reception the current supplier is probably overpriced.','End the lead permanently.','Ask reception to request the current contract before transferring you.','Explain briefly that existing suppliers are normal and ask who handles future replacements, alternative brands or overflow purchases.'],answer:3,explain:'Existing supplier use is discovery information, not automatic disqualification.'},
      {category:'Gatekeeper judgement',weight:5,critical:true,scenario:'A receptionist says, "The owner is not interested," but does not say the owner made that decision and there is no opt-out request.',prompt:'How should the rep handle it?',options:['Calmly establish whether that is the owner\'s actual decision or a gatekeeper assumption and, if appropriate, ask for the equipment buyer or best time to reach them.','Record a confirmed DM rejection.','Argue until reception transfers the call.','Call back repeatedly under a different reason.'],answer:0,explain:'A gatekeeper assumption is not automatically a decision-maker rejection. A clear DNC request must still be respected.'},
      {category:'Gatekeeper - email',weight:3,critical:false,scenario:'Reception says, "Just send an email." You do not know the buyer name or whether anything is planned.',prompt:'What makes the email route useful?',options:['Send the full catalogue to the info address and wait.','Refuse to email until the DM speaks to you.','Confirm the DM name and correct email, ask one useful planning question if appropriate and establish a sensible follow-up.','Ask reception to choose the equipment first.'],answer:2,explain:'A useful email has a person, purpose and next action.'},
      {category:'Rep independence',weight:5,critical:true,scenario:'A buyer wants a standard commercial selectorised circuit. You have the movement list, quantities, space, users, budget and approved product guide.',prompt:'What should the rep do?',options:['Send the requirement to Michael and wait for him to select every machine.','Build the sensible shortlist or quote using approved information, then ask Michael only for genuinely unconfirmed supplier, delivery, technical or approval points.','Tell the buyer to choose from the website.','Choose the cheapest machines so internal approval is unnecessary.'],answer:1,explain:'Support should fill real information or authority gaps, not replace normal rep competence.'},
      {category:'Stock and lead time',weight:5,critical:true,scenario:'During a call the buyer asks, "Are those definitely in stock and can you install next Friday?" The rep has not checked.',prompt:'Which response is strongest?',options:['Yes, commercial equipment is usually stocked.','Probably - put subject to confirmation in the quote.','Tell the buyer to ask Michael directly.','Explain that the model can be quoted now but stock, exact lead time and installation date will be confirmed before committing to that date.'],answer:3,explain:'The rep can keep the sale moving without inventing stock or delivery.'},
      {category:'Quote ownership',weight:5,critical:true,scenario:'The buyer has confirmed the exact standard products and quantities. The rep is trained on the approved quote process; only delivery pricing remains unknown.',prompt:'What should happen?',options:['Prepare the product quote/schedule, gather the complete access brief and request only the delivery/install confirmation before representing that cost as confirmed.','Ask Michael to rebuild the entire quote from the beginning.','Send website screenshots instead of a quote.','Promise free delivery and correct it later if needed.'],answer:0,explain:'Once trained, the rep should handle the normal quote work and escalate only the real unknown.'},
      {category:'Delivery - clear case',weight:5,critical:true,scenario:'Customer: "Ground-floor industrial unit, van can park by the roller shutter, kit goes just inside, and we want installation."',prompt:'What is still required before delivery/install is treated as quoted?',options:['Nothing; the description is clear enough.','Only the postcode.','Record the favourable route but confirm address/contact, shutter/threshold, unloading restrictions, final position, installation/assembly/pallet-removal scope and any power/anchoring needs, then obtain the price.','Ask the customer to invent a formal logistics plan themselves.'],answer:2,explain:'The rep turns natural customer language into the usable access brief.'},
      {category:'Delivery - vague case',weight:5,critical:true,scenario:'Customer: "We are upstairs but there is a lift. Parking is fine. You come through reception. We have had machines before."',prompt:'What is the best next action?',options:['Assume installation is straightforward because previous deliveries worked.','Confirm unloading point, entrance/internal widths and corners, lift door/internal dimensions and load limit, final room/position, site timing and service scope; request photos or measurements where vague.','Quote kerbside and let the crew decide onsite.','Ask Michael to call the customer and do all access discovery.'],answer:1,explain:'A vague statement must be converted into measured route and service facts.'},
      {category:'Commercial rating - cardio',weight:5,critical:true,scenario:'A normal dues-paying commercial gym asks for Star Trac 4 Series treadmills because they are cheaper.',prompt:'Which judgement matches the current Core matrix?',options:['4 Series is automatically full commercial because it is Star Trac.','Any treadmill becomes commercial if the customer signs a waiver.','Commercial rating only matters after delivery.','The 4 Series treadmill is shown as not intended for commercial use under the international commercial column, so use an appropriate commercial route instead.'],answer:3,explain:'Commercial suitability must be checked before price pushes the rep into the wrong product class.'},
      {category:'Commercial rating - cardio',weight:3,critical:false,scenario:'A busy gym needs full-commercial Star Trac cardio and asks which family is the safer starting point.',prompt:'Which route is supported by the current matrix?',options:['Star Trac 6/8 Series commercial cardio, subject to exact model and requirement.','Star Trac 4 Series because lower price proves suitability.','Star Trac S-TRX because every S model is commercial.','Jacobs Ladder 2 because all StairMaster products share one classification.'],answer:0,explain:'The 6/8 commercial cardio families are listed for international commercial use; several cheaper routes are not.'},
      {category:'Commercial rating - strength',weight:5,critical:true,scenario:'A high-traffic dues-paying gym asks for a Nautilus selectorised line. The rep is considering Instinct and Inspiration.',prompt:'What classification point matters before recommending?',options:['Instinct and Inspiration are identical commercial duty levels.','Inspiration is domestic-only.','Instinct is specifically marked light commercial in the Core matrix, while Inspiration is within the commercial strength family.','Commercial classification does not matter if the price is acceptable.'],answer:2,explain:'The rep should know the broad commercial/light-commercial distinction before quoting.'},
      {category:'Warranty judgement',weight:5,critical:true,scenario:'The customer asks for the exact parts-and-labour warranty on a specific model. The rep knows it is commercially suitable but does not have the current exact row open.',prompt:'What should the rep do?',options:['Give the warranty from memory because the commercial classification is known.','Explain the commercial classification confidently, but verify the exact current model/territory/component warranty before confirming the numbers.','Say every commercial product has the same warranty.','Tell the customer warranty is irrelevant on commercial equipment.'],answer:1,explain:'Reps should know suitability, but exact warranty wording remains a fact to verify.'},
      {category:'Indoor cycling',weight:3,critical:false,scenario:'A studio wants coached indoor cycling, robust resistance and cadence/power data.',prompt:'What is the strongest starting route?',options:['Star Trac recumbent bikes because they have back support.','Any upright bike as long as it is commercial.','StairMaster 4G because the class is high intensity.','Qualify the class and data requirements, then shortlist appropriate Schwinn indoor-cycle options and verify the exact configuration.'],answer:3,explain:'Studio cycling requires the relevant product category, not a generic exercise bike.'},
      {category:'Strength discovery',weight:3,critical:false,scenario:'A gym says, "We need a leg machine."',prompt:'What should the rep ask before quoting?',options:['Clarify the movement, loading style, user group, footprint, adjustment/accessibility, traffic, existing line and budget.','Quote the first leg machine on the website.','Ask only whether they prefer black upholstery.','Send the request to Michael with no further questions.'],answer:0,explain:'A movement and use case must be defined before an exact machine is selected.'},
      {category:'Competitor objection',weight:5,critical:true,scenario:'A competitor is GBP 4,000 cheaper, but their quote may use a smaller console and exclude installation.',prompt:'What should the rep do first?',options:['Promise a GBP 4,000 match.','Tell the buyer the competitor is lower quality.','Compare the products, inclusions, warranty, delivery/install and the buyer\'s decision condition, then take a complete case for any needed approval.','Remove installation from the AresFit quote without asking.'],answer:2,explain:'The price gap has to be diagnosed before discount or scope changes.'},
      {category:'Discount authority',weight:5,critical:true,scenario:'A buyer says, "Give me another 5% off today and I will order." The rep has no discount authority.',prompt:'What is the correct action?',options:['Apply 5% provisionally because the order is ready.','Confirm the buying condition and complete commercial context, then request approval without promising the outcome.','Offer 3% because it is below the customer request.','Tell the customer Michael always approves small discounts.'],answer:1,explain:'The rep should expose the decision condition but cannot create an unauthorised price promise.'},
      {category:'Finance',weight:5,critical:true,scenario:'A gym asks whether finance is guaranteed and what the exact monthly payment will be.',prompt:'What can the rep safely do?',options:['Guarantee approval if the order value is high enough.','Estimate a monthly payment and call it provisional.','Avoid mentioning finance entirely.','Explain finance can be explored as a business route, but approval and exact terms/figures depend on the provider and must be confirmed.'],answer:3,explain:'Finance may be discussed without guaranteeing approval or figures.'},
      {category:'Supplier setup',weight:3,critical:false,scenario:'A gym has a main supplier but buys emergency replacements elsewhere when lead times are poor.',prompt:'What should the rep conclude?',options:['There is a possible secondary-supplier opening; qualify which categories, triggers, decision-maker and timing apply.','There is no opportunity until the main contract ends.','Immediately quote a full refit.','Tell them to stop using the main supplier.'],answer:0,explain:'Existing supplier relationships can contain specific gaps and alternative buying routes.'},
      {category:'App outcome',weight:3,critical:false,scenario:'Reception takes your details and says the owner should call back, but no time is agreed and the owner has not spoken to you.',prompt:'Which outcome best matches?',options:['Callback 15:00 today.','Contacted - qualified.','Awaiting Callback, with a factual note that details were taken and no time was agreed.','No Answer.'],answer:2,explain:'Awaiting Callback is different from a scheduled rep-owned Callback.'},
      {category:'App outcome',weight:3,critical:false,scenario:'The call reaches voicemail. You do not leave a message.',prompt:'What should the record show?',options:['Contacted because the voicemail system answered.','VM/Voicemail with a truthful no-message record or approved auto-note.','Awaiting Callback because the number is valid.','DNC after one voicemail.'],answer:1,explain:'The outcome should describe what actually happened and whether a message was left.'},
      {category:'Lead eligibility',weight:3,critical:false,scenario:'A scraped lead appears to be a takeaway business and there is no obvious gym website. You are about to mark it as an ineligible/dead outcome under the team convention.',prompt:'What should happen first?',options:['Call it ten more times.','Guess from the business name alone.','Send a quote to test whether it is real.','Use the Lead Research/Map view to confirm there is no real gym/facility before killing the lead.'],answer:3,explain:'Bad data should be verified before a potentially valid lead is removed from the working pool.'},
      {category:'Follow-up',weight:3,critical:false,scenario:'The board reviews the quote Thursday at 11:00 and the buyer asks you to call after the meeting.',prompt:'What is the strongest next action?',options:['Set a specific post-meeting callback and record what decision or feedback you expect to discuss.','Wait indefinitely for the buyer to call.','Call during the meeting every ten minutes.','Email a new catalogue instead.'],answer:0,explain:'A strong follow-up is tied to a buyer event and has a specific owner and time.'},
      {category:'Opening and control',weight:3,critical:false,scenario:'The owner answers and says, "You have thirty seconds."',prompt:'What should the rep do?',options:['List every AresFit brand as fast as possible.','Ask for the budget immediately.','Give a one-sentence reason for the call and ask one high-value current-setup or buying question.','Ask Michael to call later because the buyer is rushed.'],answer:2,explain:'Limited attention should be used for relevance and discovery, not a compressed monologue.'},
      {category:'DNC',weight:5,critical:true,scenario:'A contact clearly says, "Remove us. Do not call or email again."',prompt:'What must happen?',options:['Ask whether a six-month retry would be acceptable.','Record the DNC request accurately, preserve suppression evidence and stop sales contact.','Delete the row so there is no record.','Try another employee at the same site.'],answer:1,explain:'A clear opt-out ends sales activity and must remain visible to prevent repeat contact.'},
      {category:'Complaint',weight:5,critical:true,scenario:'A contact says AresFit has called repeatedly, demands to know the data source and threatens a complaint.',prompt:'What should the rep do?',options:['Speculate about where the data came from.','Continue the pitch to prove the calls were worthwhile.','Promise that every data source used is legally compliant.','Stop selling, record the complaint accurately, suppress further contact as required and bring the factual issue to Michael rather than inventing a legal explanation.'],answer:3,explain:'Complaints require accurate recording and escalation, not improvisation.'},
      {category:'Shopify',weight:5,critical:true,scenario:'A trained rep has created the approved quote/draft and sees Shopify\'s "Send invoice" action.',prompt:'What should they do?',options:['Do not use Send invoice; follow the approved AresFit quote/customer-email process.','Use it whenever the customer is urgent.','Use it only if delivery is already priced.','Ask the customer to click it themselves.'],answer:0,explain:'Tool access does not change the approved customer-document process.'},
      {category:'File process',weight:5,critical:true,scenario:'Today\'s calling is finished. The current Input and new Output are saved in the managed shared folder.',prompt:'What should preserve the newest call data for the next session?',options:['Return to the untouched Assigned file.','Create a personal master on the rep laptop.','Use the latest Output as the source for the next correctly dated Input while preserving the required 22-column structure and managed file process.','Merge every historical CSV before the next call.'],answer:2,explain:'The newest managed Output carries the newest working data into the next Input.'},
      {category:'Integrated judgement',weight:5,critical:true,scenario:'A gym wants six treadmills and four bikes for a first-floor refit. Budget and users are clear. The buyer asks for a quote today, says the lift is "big", asks whether everything is in stock and wants a discount because another supplier is cheaper.',prompt:'Which sequence is strongest?',options:['Promise stock and a small discount, then collect access after the order.','Finish the exact model shortlist yourself, convert the vague lift/site description into a proper access brief, prepare the standard quote, compare the competitor scope, then request only the stock/lead-time, delivery/install and discount confirmations that require internal authority before making those commitments.','Send the full opportunity to Michael and ask him to take over the customer.','Quote website totals with free delivery and mark everything subject to confirmation.'],answer:1,explain:'The rep should do the rep work, isolate the genuine unknowns and escalate only the facts or authority they cannot provide themselves.'}
    ];
    if(assessmentQuestions.length!==30) throw new Error('Assessment patch must contain exactly 30 questions.');
    html=html.slice(0,assessmentBodyStart)+assessmentQuestions.map(question=>JSON.stringify(question)).join(',')+html.slice(assessmentEnd);

    html=html.replace("b.textContent=adminUnlocked?'Admin ✓':'Admin';","b.textContent=adminUnlocked?'🔓':'🔒';");
    html=html.replace("b.title=adminUnlocked?'Admin review mode is active. Select to lock it again.':'Unlock every course page for review';","b.title=adminUnlocked?'Admin review active — select to lock':'Admin unlock — review every course page';");

    html=html.replace(/AresFit Sales Rep Course v7\.4/g,'AresFit Sales Rep Course v7.5');
    html=html.replace(/AresFit Rep Training v7\.4/g,'AresFit Rep Training v7.5');
    html=html.replace("const VERSION='7.4';","const VERSION='7.5';");

    if(!(html.indexOf('"id":"aresfit_business"')<html.indexOf('"id":"ownership"'))) throw new Error('Opening module order check failed.');
    if(html.includes("adminUnlocked=localStorage.getItem(ADMIN_KEY)==='1'")) throw new Error('Admin lock reset check failed.');
    const v75Checks=['Questions that reveal product fit without forcing the customer to name a model','Delivery scenario - customer gives a vague','Know what the main app outcomes actually mean','Rep independence','AresFit Rep Training v7.5'];
    const v75Missing=v75Checks.filter(marker=>!html.includes(marker));
    if(v75Missing.length) throw new Error(`The v7.5 course patch failed: ${v75Missing.join(', ')}`);

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('bar').style.display='none';
    document.getElementById('status').textContent='The course could not be loaded.';
    document.getElementById('err').textContent=error.message;
  }
})();
</script>
</body>
</html>
