<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresFit Sales Rep Course v7.6</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#10233f}body{display:grid;place-items:center}.box{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #cbd5e1;padding:32px;box-shadow:0 12px 35px rgba(15,35,63,.12)}h1{margin:0 0 8px}.version{font-size:12px;color:#64748b}.bar{height:8px;background:#dbe7f4;margin-top:20px;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:40%;background:#315c8c;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(280%)}}#err{color:#a12b2b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><h1>AresFit Sales Rep Course</h1><div class="version">Loading full course v7.6</div><p id="status">Loading the training platform…</p><div class="bar" id="bar"></div><p id="err"></p></div>
<script src="course-v76/patch.js?v=v76-product-judgement"></script>
<script>
(async()=>{
  try{
    if(typeof window.applyAresFitCourseV76!=='function') throw new Error('The v7.6 course patch could not be loaded.');
    const stamp='v76-product-judgement';
    const files=Array.from({length:12},(_,i)=>`course-v74/part-${String(i+1).padStart(2,'0')}.html?v=${stamp}`);
    const parts=[];
    for(const file of files){
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(`Missing course file: ${file} (${response.status})`);
      const text=await response.text();
      if(!text) throw new Error(`Empty course file: ${file}`);
      parts.push(text);
    }
    const base=parts.join('');
    const checks=['<!doctype html>','AresFit Sales Rep Course v7.4','How AresFit works as a supplier',"const VERSION='7.4'","const ADMIN_PIN='789654'",'repSignInBtn','</html>'];
    const missing=checks.filter(marker=>!base.toLowerCase().includes(marker.toLowerCase()));
    if(missing.length) throw new Error(`The base course failed its integrity check: ${missing.join(', ')}`);
    const html=window.applyAresFitCourseV76(base);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('bar').style.display='none';
    document.getElementById('status').textContent='The course could not be loaded.';
    document.getElementById('err').textContent=error.message;
  }
})();
</script>
</body>
</html>
