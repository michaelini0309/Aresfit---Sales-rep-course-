<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresFit Sales Rep Course</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#10233f}body{display:grid;place-items:center}.box{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #cbd5e1;padding:32px;box-shadow:0 12px 35px rgba(15,35,63,.12)}h1{margin:0 0 12px}.bar{height:8px;background:#dbe7f4;margin-top:20px;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:40%;background:#315c8c;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(280%)}}#err{color:#a12b2b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><h1>AresFit Sales Rep Course</h1><p id="status">Loading the course…</p><div class="bar" id="bar"></div><p id="err"></p></div>
<script>
(async()=>{
  try{
    const stamp='20260726-admin-review-v1';
    const files=Array.from({length:12},(_,i)=>`course-src/part-${String(i+1).padStart(2,'0')}.html?v=${stamp}`);
    const parts=[];
    for(const file of files){
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(`Missing course file: ${file} (${response.status})`);
      const text=await response.text();
      if(!text) throw new Error(`Empty course file: ${file}`);
      parts.push(text);
    }
    let html=parts.join('');
    if(!html.toLowerCase().includes('<!doctype html>')||!html.includes('Commercial Sales Rep Training')||!html.includes('aresfit_rep_course_v6_state')||!html.toLowerCase().includes('</html>')){
      throw new Error('The published course failed its integrity check.');
    }
    const adminPatch=`<script>
const ADMIN_REVIEW_KEY='aresfit_rep_course_admin_review_v1';
const ADMIN_REVIEW_PIN='789654';
let adminReviewUnlocked=false;
try{adminReviewUnlocked=localStorage.getItem(ADMIN_REVIEW_KEY)==='1';}catch(e){}
function applyAdminReviewUi(){
 const top=document.querySelector('.progress-top');
 if(top&&!document.getElementById('adminReviewUnlock')){
  const button=document.createElement('button');button.type='button';button.id='adminReviewUnlock';button.title='Unlock every course page for review';button.style.cssText='margin-left:7px;padding:3px 6px;border:1px solid rgba(255,255,255,.38);border-radius:2px;background:rgba(255,255,255,.08);color:#dce7f2;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer';button.textContent=adminReviewUnlocked?'Admin ✓':'Admin';
  button.onclick=()=>{if(adminReviewUnlocked){toast('Admin review is already active');return;}const pin=prompt('Enter the 6-digit admin PIN');if(pin===null)return;if(!/^\\d{6}$/.test(pin)){toast('Enter a 6-digit PIN');return;}if(pin!==ADMIN_REVIEW_PIN){toast('Incorrect admin PIN');return;}adminReviewUnlocked=true;try{localStorage.setItem(ADMIN_REVIEW_KEY,'1');}catch(e){}button.textContent='Admin ✓';button.style.background='#fff';button.style.color='#315c8c';updateProgressUI();if(state.lastView==='dashboard')renderDashboard();if(state.lastView==='assessmentIntro')openAssessmentIntro();toast('Admin review unlocked');};top.appendChild(button);
 }
 const button=document.getElementById('adminReviewUnlock');if(button&&adminReviewUnlocked){button.textContent='Admin ✓';button.style.background='#fff';button.style.color='#315c8c';}
 if(adminReviewUnlocked){document.querySelectorAll('.module-button').forEach(b=>{b.disabled=false;b.classList.remove('locked');});document.querySelectorAll('.dashboard-card').forEach(c=>c.classList.remove('locked'));const assessmentButton=document.getElementById('assessmentBtn');if(assessmentButton)assessmentButton.disabled=false;const startButton=document.getElementById('startAssessment');if(startButton)startButton.disabled=false;}
}
const originalModuleUnlocked=moduleUnlocked;moduleUnlocked=function(index){return adminReviewUnlocked||originalModuleUnlocked(index);};
const originalRenderSidebar=renderSidebar;renderSidebar=function(){originalRenderSidebar();applyAdminReviewUi();};
const originalRenderDashboard=renderDashboard;renderDashboard=function(){originalRenderDashboard();applyAdminReviewUi();if(adminReviewUnlocked){document.querySelectorAll('.dashboard-card').forEach((card,index)=>{card.classList.remove('locked');card.onclick=()=>openModule(index,state.currentModule===index?state.currentStep:0);});document.getElementById('assessmentBtn').disabled=false;}};
const originalRenderLesson=renderLesson;renderLesson=function(){originalRenderLesson();if(adminReviewUnlocked)document.getElementById('lessonNext').disabled=false;};
const originalOpenAssessmentIntro=openAssessmentIntro;openAssessmentIntro=function(){originalOpenAssessmentIntro();if(adminReviewUnlocked){document.getElementById('startAssessment').disabled=false;document.getElementById('assessmentLockNote').innerHTML='<strong>Admin review mode</strong><p>The assessment is unlocked for course review. Rep completion progress has not been altered.</p>';}};
document.getElementById('lessonNext').addEventListener('click',event=>{if(!adminReviewUnlocked)return;event.preventDefault();event.stopImmediatePropagation();const module=modules[state.currentModule];if(state.currentStep<module.steps.length-1){state.currentStep++;saveState();renderLesson();window.scrollTo(0,0);}else if(state.currentModule<modules.length-1){openModule(state.currentModule+1,0);}else{openAssessmentIntro();}},true);
applyAdminReviewUi();updateProgressUI();
<\/script>`;
    html=html.replace(/<\/body>\s*<\/html>\s*$/i,adminPatch+'</body></html>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('bar').style.display='none';
    document.getElementById('status').textContent='The course could not be loaded.';
    document.getElementById('err').textContent=error.message;
  }
})();
</script>
</body>
</html>
