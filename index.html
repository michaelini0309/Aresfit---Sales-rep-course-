<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresFit Sales Rep Course v7.4</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef3f8;color:#10233f}body{display:grid;place-items:center}.box{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #cbd5e1;padding:32px;box-shadow:0 12px 35px rgba(15,35,63,.12)}h1{margin:0 0 8px}.version{font-size:12px;color:#64748b}.bar{height:8px;background:#dbe7f4;margin-top:20px;overflow:hidden}.bar:after{content:'';display:block;height:100%;width:40%;background:#315c8c;animation:load 1.2s infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(280%)}}#err{color:#a12b2b;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><h1>AresFit Sales Rep Course</h1><div class="version">Loading full course v7.4</div><p id="status">Loading the training platform…</p><div class="bar" id="bar"></div><p id="err"></p></div>
<script>
(async()=>{
  try{
    const stamp='v74-module-order-admin-reset';
    const files=Array.from({length:12},(_,i)=>`course-v74/part-${String(i+1).padStart(2,'0')}.html?v=${stamp}`);
    const parts=[];
    for(const file of files){
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(`Missing course file: ${file} (${response.status})`);
      const text=await response.text();
      if(!text) throw new Error(`Empty course file: ${file}`);
      parts.push(text);
    }
    let html=parts.join('');
    const checks=['<!doctype html>','AresFit Sales Rep Course v7.4','How AresFit works as a supplier',"const VERSION='7.4'","const ADMIN_PIN='789654'",'repSignInBtn','AresFit Rep Training v7.4','</html>'];
    const missing=checks.filter(marker=>!html.toLowerCase().includes(marker.toLowerCase()));
    if(missing.length) throw new Error(`The published v7.4 course failed its integrity check: ${missing.join(', ')}`);

    html=html.replace("try{adminUnlocked=localStorage.getItem(ADMIN_KEY)==='1';}catch(e){}","try{localStorage.removeItem(ADMIN_KEY)}catch(e){}");
    html=html.replace("try{localStorage.setItem(ADMIN_KEY,adminUnlocked?'1':'0')}catch(e){}","try{localStorage.removeItem(ADMIN_KEY)}catch(e){}");

    const moduleStartMarker='const modules=[';
    const moduleEndMarker='];\nconst assessmentQuestions=';
    const moduleStart=html.indexOf(moduleStartMarker);
    const moduleEnd=html.indexOf(moduleEndMarker,moduleStart);
    if(moduleStart<0||moduleEnd<0) throw new Error('Could not locate course modules.');
    const bodyStart=moduleStart+moduleStartMarker.length;
    const body=html.slice(bodyStart,moduleEnd);
    const items=[];
    let i=0;
    while(i<body.length){
      while(i<body.length&&/[\s,]/.test(body[i])) i++;
      if(i>=body.length) break;
      if(body[i]!=='{') throw new Error('Course module structure is invalid.');
      const start=i;
      let depth=0,inString=false,escaped=false;
      for(;i<body.length;i++){
        const ch=body[i];
        if(inString){
          if(escaped) escaped=false;
          else if(ch==='\\') escaped=true;
          else if(ch==='"') inString=false;
        }else{
          if(ch==='"') inString=true;
          else if(ch==='{'||ch==='[') depth++;
          else if(ch==='}'||ch===']'){
            depth--;
            if(depth===0){i++;items.push(body.slice(start,i));break;}
          }
        }
      }
    }
    const ownershipIndex=items.findIndex(item=>item.includes('"id":"ownership"'));
    const businessIndex=items.findIndex(item=>item.includes('"id":"aresfit_business"'));
    if(ownershipIndex<0||businessIndex<0) throw new Error('Required opening modules are missing.');
    if(businessIndex!==0){
      const business=items.splice(businessIndex,1)[0];
      items.unshift(business);
    }
    const ownershipNow=items.findIndex(item=>item.includes('"id":"ownership"'));
    if(ownershipNow!==1){
      const ownership=items.splice(ownershipNow,1)[0];
      items.splice(1,0,ownership);
    }
    html=html.slice(0,bodyStart)+items.join(',')+html.slice(moduleEnd);

    html=html.replace("b.textContent=adminUnlocked?'Admin ✓':'Admin';","b.textContent=adminUnlocked?'🔓':'🔒';");
    html=html.replace("b.title=adminUnlocked?'Admin review mode is active. Select to lock it again.':'Unlock every course page for review';","b.title=adminUnlocked?'Admin review active — select to lock':'Admin unlock — review every course page';");

    if(!(html.indexOf('"id":"aresfit_business"')<html.indexOf('"id":"ownership"'))) throw new Error('Opening module order check failed.');
    if(html.includes("adminUnlocked=localStorage.getItem(ADMIN_KEY)==='1'")) throw new Error('Admin lock reset check failed.');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('bar').style.display='none';
    document.getElementById('status').textContent='The course could not be loaded.';
    document.getElementById('err').textContent=error.message;
  }
})();
</script>
</body>
</html>
