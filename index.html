<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AresFit Sales Rep Course</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f7;color:#17212b;font-family:Arial,Helvetica,sans-serif}.loader{width:min(560px,calc(100% - 32px));background:#fff;border:1px solid #c8d1dc;padding:30px;box-shadow:0 5px 18px rgba(28,44,62,.08)}h1{margin:0 0 8px;color:#18283a}.bar{height:7px;background:#dce7f5;margin-top:18px;overflow:hidden}.bar:after{content:"";display:block;width:42%;height:100%;background:#315c8c;animation:load 1.1s infinite}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(270%)}}#error{color:#b63b49;white-space:pre-wrap}</style>
</head>
<body>
<div class="loader"><h1>AresFit Sales Rep Course</h1><div id="status">Loading the course…</div><div class="bar" id="bar"></div><p id="error"></p></div>
<script>window.__coursePayloadParts=[];</script>
<script src="payload-01.js"></script>
<script src="payload-02.js"></script>
<script src="payload-03.js"></script>
<script src="payload-04.js"></script>
<script src="payload-05.js"></script>
<script src="payload-06.js"></script>
<script>
(async()=>{
 try{
  const b64=(window.__coursePayloadParts||[]).join('');
  if(!b64) throw new Error('Course data is missing.');
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('This browser does not support the course loader. Open the link in a current version of Chrome, Edge or Safari.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.toLowerCase().includes('<!doctype html')) throw new Error('The course file did not decode correctly.');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent='The course could not be loaded.';document.getElementById('error').textContent=e.message;}
})();
</script>
</body>
</html>
